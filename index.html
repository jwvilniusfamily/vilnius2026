        HE: { title: "מדיניות פרטיות", text: "<p>אנו משתמשים באחסון מקומי בלבד כדי לשמור את ההגדרות שלך. לא נעשה שימוש בעוגיות מעקב.</p><p>השם, המדינה והתגובות שלך נשמרים במסד נתונים. הנתונים אינם משמשים למטרות מסחריות.</p>" },
        JA: { title: "プライバシーポリシー", text: "<p>設定を保存するためにローカルストレージのみを使用します。トラッキングクッキーは使用されません。</p><p>お名前、国名、コメントはデータベースに保存されます。データは商業目的で使用されることはありません。</p>" },
        FR: { title: "Politique de confidentialité", text: "<p>Nous utilisons uniquement le stockage local pour enregistrer vos paramètres. Aucun cookie de suivi n'est utilisé.</p><p>Votre nom, votre pays et vos commentaires sont stockés dans une base de données. Les données ne sont pas utilisées à des fins commerciales.</p>" },
        SV: { title: "Integritetspolicy", text: "<p>Vi använder endast lokal lagring för att spara dina inställningar. Inga spårningscookies används.</p><p>Ditt namn, land och kommentarer lagras i en databas. Data används inte för kommersiella ändamål.</p>" }
      },
      terms: {
        LT: { title: "Naudojimo taisyklės", text: "<p>Visos nuotraukos ir vaizdo įrašai skirti tik asmeniniam peržiūrai.</p><p>Draudžiama publikuoti medžiagą kitose svetainėse ar socialiniuose tinkluose be leidimo.</p><p>Draudžiama naudoti medžiagą komerciniais tikslais.</p>" },
        EN: { title: "Terms of Use", text: "<p>All photos and videos are for personal viewing only.</p><p>It is forbidden to publish materials on other sites or social networks without permission.</p><p>It is forbidden to use materials for commercial purposes.</p>" },
        RU: { title: "Правила использования", text: "<p>Все фотографии и видео предназначены только для личного просмотра.</p><p>Запрещается публиковать материалы на других сайтах или в социальных сетях без разрешения.</p><p>Запрещается использовать материалы в коммерческих целях.</p>" },
        LV: { title: "Lietošanas noteikumi", text: "<p>Visas fotogrāfijas un video ir paredzēti tikai personīgai apskatei.</p><p>Ir aizliegts publicēt materiālus citās vietnēs vai sociālajos tīklos bez atļaujas.</p><p>Ir aizliegts izmantot materiālus komerciāliem mērķiem.</p>" },
        KUR: { title: "Mercên Bikaranînê", text: "<p>Hemû wêne û vîdyo tenê ji bo temaşekirina kesane ne.</p><p>Qedexe ye ku materyal bêyî destûr li ser malperên din an torên civakî werin weşandin.</p><p>Qedexe ye ku materyal ji bo armancên bazirganî werin bikar anîn.</p>" },
        AM: { title: "Օգտագործման պայմաններ", text: "<p>Բոլոր լուսանկարները և տեսանյութերը միայն անձնական դիտման համար են:</p><p>Արգելվում է նյութերը հրապարակել այլ կայքերում կամ սոցիալական ցանցերում առանց թույլտվության:</p><p>Արգելվում է նյութերն օգտագործել առևտրային նպատակներով:</p>" },
        PT: { title: "Termos de Uso", text: "<p>Todas as fotos e vídeos são apenas para visualização pessoal.</p><p>É proibido publicar materiais em outros sites ou redes sociais sem permissão.</p><p>É proibido usar materiais para fins comerciais.</p>" },
        ES: { title: "Términos de Uso", text: "<p>Todas las fotos y videos son solo para visualización personal.</p><p>Está prohibido publicar materiales en otros sitios o redes sociales sin permiso.</p><p>Está prohibido utilizar materiales con fines comerciales.</p>" },
        HE: { title: "תנאי שימוש", text: "<p>כל התמונות והסרטונים מיועדים לצפייה אישית בלבד.</p><p>חל איסור לפרסם חומרים באתרים אחרים או ברשתות חברתיות ללא אישור.</p><p>חל איסור להשתמש בחומרים למטרות מסחריות.</p>" },
        JA: { title: "利用規約", text: "<p>すべての写真および動画は個人利用のみを目的としています。</p><p>許可なく他のサイトや SNS にコンテンツを転載することを禁じます。</p><p>商業目的での素材の使用は禁止されています。</p>" },
        FR: { title: "Conditions d'utilisation", text: "<p>Toutes les photos et vidéos sont destinées à un visionnage personnel uniquement.</p><p>Il est interdit de publier des documents sur d'autres sites ou réseaux sociaux sans autorisation.</p><p>Il est interdit d'utiliser des documents à des fins commerciales.</p>" },
        SV: { title: "Användarvillkor", text: "<p>Alla foton och videor är endast för personlig visning.</p><p>Det är förbjudet att publicera material på andra webbplatser eller sociala nätverk utan tillstånd.</p><p>Det är förbjudet att använda material för kommersiella ändamål.</p>" }
      }
    };

    const REACTIONS = ['❤️', '💖', '🤍', '👍', '🥰', '🙏', '🕊️', '☀️', '🇱🇹', '🇱🇻', '🇵🇱', '🇺🇦', '🇬🇧', '🇺🇸', '🇩🇪', '🇫🇷', '🇪🇸', '🇳🇬', '🇦🇲', '🇧🇷', '🇨🇱', '🇩🇴', '🇮🇱', '🇯🇵', '🇵🇹', '🇸🇪', '🇳🇴', '🇩🇰'];

    let prefs = null, currentLang = 'LT', currentCountry = 'Lithuania', currentSize = 'normal', activeCategory = 'all', activeImages = [], modalIndex = 0;
    const userId = localStorage.getItem('vf2026_uid') || ('u_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('vf2026_uid', userId);

    const escapeHTML = (str) => String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));

    window.showToast = (msg, type = 'success') => {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-[#2c2520] text-white px-6 py-4 rounded-2xl shadow-xl text-sm font-extrabold tracking-wide flex items-center gap-3 border border-white/10 toast-enter break-words max-w-[90%] md:max-w-md';
      let icon = type === 'success' ? `<svg class="w-6 h-6 text-emerald-400 animated-check flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>` : `<svg class="w-6 h-6 text-[#b2533e] animate-bounce flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>`;
      toast.innerHTML = `${icon} <span class="break-words">${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => toast.remove(), 600); }, 3500);
    };

    const init = () => {
      populateCountries();
      const saved = localStorage.getItem('vf2026_prefs');
      if (saved) {
        prefs = JSON.parse(saved); document.getElementById('welcomeScreen').classList.add('hide'); document.getElementById('bodyEl').classList.remove('overflow-hidden'); applyPrefs();
      } else {
        document.getElementById('welcomeScreen').classList.remove('hide');
      }
      renderGallery(); listenToComments(); setupModalZoom();
    };

    const populateCountries = () => { const sel = document.getElementById('wsCountry'); Object.keys(COUNTRIES).sort().forEach(c => { sel.add(new Option(`${c} (${COUNTRIES[c].native})`, c)); }); };
    
    document.getElementById('wsCountry').addEventListener('change', (e) => { const lang = COUNTRIES[e.target.value].lang; document.getElementById('wsLang').value = lang; updateWSLang(lang); });
    document.getElementById('wsLang').addEventListener('change', (e) => updateWSLang(e.target.value));
    document.getElementById('wsAccept').addEventListener('change', (e) => document.getElementById('btnContinue').disabled = !e.target.checked);

    const checkDeadline = () => {
      const deadlineDate = new Date('2026-08-13T00:00:00+03:00');
      const isPassed = new Date() > deadlineDate;
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
      const dt = document.getElementById('deadlineText');
      if(dt) dt.textContent = isPassed ? t.formClosed : t.deadlineMsg;
      if (isPassed) {
        document.getElementById('formName').disabled = true;
        document.getElementById('formText').disabled = true;
        const btn = document.getElementById('btnSubmitComment');
        if(btn) {
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');
        }
      }
    };

    const updateWSLang = (l) => {
      const t = TRANSLATIONS[l] || TRANSLATIONS['EN'];
      ['wsTitle', 'wsDesc', 'wsCountryLabel', 'wsLangLabel', 'wsSizeLabel', 'wsSizeNormal', 'wsSizeLarge', 'btnContinue', 'wsPrivacy', 'wsTerms', 'wsAcceptText', 'wsAnd'].forEach(id => {
        const el = document.getElementById(id); if(el) el.textContent = t[id];
      });
    };

    document.getElementById('btnContinue').addEventListener('click', () => {
      prefs = { country: document.getElementById('wsCountry').value, lang: document.getElementById('wsLang').value, size: document.getElementById('wsSize').value };
      localStorage.setItem('vf2026_prefs', JSON.stringify(prefs));
      document.getElementById('welcomeScreen').classList.add('hide'); document.getElementById('bodyEl').classList.remove('overflow-hidden'); 
      applyPrefs();
      const t = TRANSLATIONS[prefs.lang] || TRANSLATIONS['EN'];
      showToast(t.toastSaved, 'success');
    });

    window.openSettings = () => { document.getElementById('welcomeScreen').classList.remove('hide'); document.getElementById('bodyEl').classList.add('overflow-hidden'); };
    
    window.openDoc = (type) => {
      const l = document.getElementById('wsLang').value;
      const d = (DOCS[type][l] || DOCS[type]['EN']);
      const t = TRANSLATIONS[l] || TRANSLATIONS['EN'];
      document.getElementById('docTitle').textContent = d.title;
      document.getElementById('docContent').innerHTML = d.text;
      document.getElementById('docBtnClose').textContent = t.docBtnClose;
      document.getElementById('docModal').classList.remove('hide');
    };
    
    window.closeDoc = () => document.getElementById('docModal').classList.add('hide');

    const applyPrefs = () => {
      currentLang = prefs.lang; currentCountry = prefs.country; currentSize = prefs.size;
      
      if (currentSize === 'large') {
        document.documentElement.classList.add('text-large');
      } else {
        document.documentElement.classList.remove('text-large');
      }
      
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
      
      const wLabel = document.getElementById('privacyWarning'); if(wLabel) wLabel.textContent = t.privacyWarning;
      const hDesc = document.getElementById('heroDesc'); if(hDesc) hDesc.textContent = t.heroDesc;
      const bEx = document.getElementById('btnExplore'); if(bEx) bEx.textContent = t.btnExplore;
      const bLv = document.getElementById('btnLeaveMessage'); if(bLv) bLv.textContent = t.btnLeaveMessage;
      const gT = document.getElementById('galleryTitle'); if(gT) gT.textContent = t.galleryTitle;
      const cT = document.getElementById('commentsTitle'); if(cT) cT.textContent = t.commentsTitle;
      const cD = document.getElementById('commentsDesc'); if(cD) cD.textContent = t.commentsDesc;
      const lN = document.getElementById('labelName'); if(lN) lN.textContent = t.labelName;
      const lM = document.getElementById('labelMsg'); if(lM) lM.textContent = t.labelMsg;
      const bSub = document.getElementById('btnSubmitComment'); if(bSub && bSub.querySelector('span')) bSub.querySelector('span').textContent = t.btnSubmitComment;
      const cSub = document.getElementById('commentsSub'); if(cSub) cSub.textContent = t.commentsSub;
      const lTO = document.getElementById('labelTranslateOn'); if(lTO) lTO.textContent = t.labelTranslateOn;
      const cA = document.getElementById('catBtnAll'); if(cA) cA.textContent = t.catBtnAll;
      const cP = document.getElementById('catBtnPosters'); if(cP) cP.textContent = t.catBtnPosters;
      const cCl = document.getElementById('catBtnClay'); if(cCl) cCl.textContent = t.catBtnClay;
      const cCa = document.getElementById('catBtnCards'); if(cCa) cCa.textContent = t.catBtnCards;
      
      document.body.style.direction = currentLang === 'HE' ? 'rtl' : 'ltr';
      checkDeadline();
      renderCommentsUI();
    };

    window.switchCategory = (cat) => {
      activeCategory = cat;
      ['All', 'Posters', 'Clay', 'Cards'].forEach(c => {
        const b = document.getElementById('catBtn' + c); if(!b) return;
        b.className = (c.toLowerCase() === cat || (c === 'Cards' && cat === 'postcards')) ? "px-5 md:px-6 py-2.5 text-xs md:text-sm uppercase tracking-wider font-bold bg-[#b2533e] text-white rounded-xl shadow-md transition-all flex-shrink-0" : "px-5 md:px-6 py-2.5 text-xs md:text-sm uppercase tracking-wider font-bold text-[#8e7a68] rounded-xl hover:bg-white hover:text-[#b2533e] transition-all flex-shrink-0";
      });
      renderGallery();
    };

    const renderGallery = () => {
      const grid = document.getElementById('galleryGrid'); grid.innerHTML = ''; activeImages = IMAGES.filter(i => activeCategory === 'all' || i.cat === activeCategory);
      activeImages.forEach((img, idx) => {
        const d = document.createElement('div'); d.className = "aspect-[4/5] bg-stone-100 rounded-2xl overflow-hidden relative cursor-pointer group shadow-sm hover:shadow-2xl transition-all duration-500 hover:-translate-y-1 w-full"; d.onclick = () => openModal(idx);
        d.innerHTML = `<img src="${img.url}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy"><div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center"><svg class="w-8 h-8 md:w-10 md:h-10 text-white opacity-70" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6"></path></svg></div>`; grid.appendChild(d);
      });
    };

    let modalScale = 1; const modalImgEl = document.getElementById('modalImg');
    const openModal = (i) => { modalIndex = i; modalScale = 1; modalImgEl.style.transform = `scale(${modalScale})`; modalImgEl.src = activeImages[i].url; document.getElementById('modalIndexIndicator').textContent = `${i + 1} / ${activeImages.length}`; document.getElementById('imageModal').classList.remove('hide'); document.getElementById('imageModal').classList.add('flex'); document.getElementById('bodyEl').classList.add('overflow-hidden'); };
    window.closeImageModal = () => { document.getElementById('imageModal').classList.add('hide'); document.getElementById('imageModal').classList.remove('flex'); document.getElementById('bodyEl').classList.remove('overflow-hidden'); };
    window.navigateModal = (dir) => { modalIndex = (modalIndex + dir + activeImages.length) % activeImages.length; openModal(modalIndex); };

    const setupModalZoom = () => { modalImgEl.addEventListener('wheel', (e) => { e.preventDefault(); modalScale += e.deltaY * -0.005; modalScale = Math.min(Math.max(1, modalScale), 7); modalImgEl.style.transform = `scale(${modalScale})`; }); };

    let commentsData = [];
    const listenToComments = () => {
      const q = query(collection(db, "comments"), orderBy("timestamp", "desc"), limit(200));
      onSnapshot(q, (snap) => {
        commentsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCommentsUI();
      }, (error) => {
        console.error("Error fetching comments:", error);
      });
    };

    const renderCommentsUI = () => {
      const w = document.getElementById('commentsWrapper'); w.innerHTML = '';
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
      
      if(!commentsData.length) {
        w.innerHTML = `<div class="text-center py-16 text-[#8e7a68] font-bold border border-dashed border-[#ebdcd0] rounded-[2rem] glass-card flex flex-col items-center gap-4 fade-in w-full"><svg class="w-12 h-12 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg><span class="break-words px-2">${t.noComments}</span></div>`;
        return;
      }

      commentsData.forEach(c => {
        const div = document.createElement('div');
        div.className = "glass-card rounded-[2rem] p-5 md:p-6 shadow-sm hover:shadow-lg transition-all duration-500 relative z-10 hover:-translate-y-0.5 border border-white w-full";
        
        let translatedStr = null;
        if (c.translatedText && typeof c.translatedText === 'object') {
          const targetCode = EXT_LANGS[currentLang];
          const possibleCodes = [targetCode, currentLang, currentLang.toLowerCase(), 'iw', 'he'];
          for (let code of possibleCodes) {
            if (code && c.translatedText[code]) {
              translatedStr = c.translatedText[code];
              break;
            }
          }
        }
        
        const rawText = translatedStr ? translatedStr : c.originalText;
        const text = escapeHTML(rawText || '');
        const safeName = escapeHTML(c.name || 'Svečias');
        const safeCountry = escapeHTML(c.country || '');
        const isTr = c.originalLang !== currentLang && !!translatedStr;

        let rHtml = '';
        Object.entries(c.reactions || {}).forEach(([emoji, users]) => {
          if(!users.length) return;
          const active = users.includes(userId);
          rHtml += `<button onclick="react('${c.id}','${emoji}',${active})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-300 ${active ? 'bg-[#b2533e]/10 text-[#b2533e] border border-[#b2533e]/30' : 'bg-stone-50 text-stone-600 border border-transparent hover:bg-stone-100'} shadow-sm flex-shrink-0">${emoji} ${users.length}</button>`;
        });

        div.innerHTML = `
          <div class="flex items-start gap-4 mb-4">
            <div class="w-10 h-10 rounded-full bg-[#f5efe6] border border-[#c7b198] flex items-center justify-center text-[#b2533e] font-bold text-lg shadow-sm flex-shrink-0">
              ${safeName.charAt(0).toUpperCase()}
            </div>
            <div class="min-w-0">
              <h4 class="font-bold text-[#2c2520] text-base break-words truncate pr-2">${safeName}</h4>
              <p class="text-[10px] font-bold uppercase text-[#8e7a68] mt-0.5 tracking-wider break-words truncate pr-2">📍 ${safeCountry}</p>
            </div>
          </div>
          <p class="text-sm md:text-base text-[#5c524a] font-medium leading-relaxed whitespace-pre-wrap break-words mb-4">${text}</p>
          ${isTr ? `<div class="flex items-center gap-2 mb-4"><div class="h-px bg-[#f1ede6] flex-grow"></div><p class="text-[10px] text-[#8e7a68] font-bold uppercase tracking-widest text-center break-words shrink-0">✨ ${t.translatedFrom} ${c.originalLang}</p><div class="h-px bg-[#f1ede6] flex-grow"></div></div>` : '<div class="h-px bg-[#f1ede6] w-full mb-4"></div>'}
          
          <div class="mt-2 w-full">
            <div class="flex flex-wrap gap-2 items-center">
              ${rHtml}
              <button onclick="togglePicker('${c.id}')" class="h-9 w-12 rounded-full bg-stone-100 flex items-center justify-center text-stone-500 font-bold hover:bg-stone-200 hover:text-[#b2533e] transition-colors duration-300 shadow-sm border border-[#ebdcd0] flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
              </button>
            </div>
            <div id="picker-${c.id}" class="hidden overflow-hidden transition-all duration-300 mt-3 w-full">
              <div class="bg-[#faf9f6] border border-[#ebdcd0] rounded-2xl p-3 shadow-sm flex flex-wrap gap-2 justify-center">
                ${REACTIONS.map(e => `<button onclick="react('${c.id}','${e}',false); togglePicker('${c.id}')" class="w-10 h-10 flex items-center justify-center text-2xl hover:bg-white hover:shadow-sm rounded-full transition-all duration-200 hover:scale-125 focus:outline-none flex-shrink-0">${e}</button>`).join('')}
              </div>
            </div>
          </div>
        `;
        w.appendChild(div);
      });
    };

    window.togglePicker = (id) => {
      const p = document.getElementById(`picker-${id}`);
      if(p.classList.contains('hidden')) {
        document.querySelectorAll('div[id^="picker-"]').forEach(el => el.classList.add('hidden'));
        p.classList.remove('hidden');
        p.classList.add('fade-in');
      } else {
        p.classList.add('hidden');
        p.classList.remove('fade-in');
      }
    };

    window.react = async (id, em, act) => {
      const r = doc(db, "comments", id);
      await updateDoc(r, { [`reactions.${em}`]: act ? arrayRemove(userId) : arrayUnion(userId) });
    };

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitComment');
      const loader = document.getElementById('loader');
      const name = document.getElementById('formName').value;
      const text = document.getElementById('formText').value;
      
      btn.disabled = true;
      loader.classList.remove('hide');
      const textEl = document.getElementById('btnSubmitText');
      if (textEl) textEl.classList.add('opacity-0');
      
      const targetLangs = ['lt', 'en', 'ru', 'lv', 'ku', 'hy', 'pt', 'es', 'iw', 'he', 'ja', 'fr', 'sv'];
      
      try {
        await addDoc(collection(db, "comments"), {
          name: name,
          country: currentCountry,
          originalLang: currentLang,
          originalText: text,
          languages: targetLangs,
          timestamp: serverTimestamp(),
          reactions: {}
        });
        document.getElementById('formText').value = '';
        const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
        showToast(t.toastSent, 'success');
      } catch (err) {
        console.error("Error adding document: ", err);
      } 
      finally {
        btn.disabled = false;
        loader.classList.add('hide');
        if (textEl) textEl.classList.remove('opacity-0');
      }
    });

    init();
  </script>

</body>
</html>
