    html.text-large {

    }
    body {

    .modal-overlay { backdrop-filter: blur(12px); background-color: rgba(250, 249, 246, 0.95); }
    .hide { display: none !important; }
    .fade-in { animation: fadeIn 0.6s ease-in-out forwards; }

      to { opacity: 1; transform: translateY(0); }

    const populateCountries = () => {

        sel.add(new Option(`${c} (${COUNTRIES[c].native})`, c));
      });

    document.getElementById('wsCountry').addEventListener('change', (e) => {
      const lang = COUNTRIES[e.target.value].lang;
      document.getElementById('wsLang').value = lang;
      updateWSLang(lang);
    });

    document.getElementById('wsAccept').addEventListener('change', (e) => document.getElementById('btnContinue').disabled = !e.target.checked);

      ['wsTitle', 'wsDesc', 'wsCountryLabel', 'wsLangLabel', 'wsSizeLabel', 'wsSizeNormal', 'wsSizeLarge', 'btnContinue', 'wsPrivacy', 'wsTerms', 'wsAcceptText', 'wsAnd'].forEach(id => {

      document.getElementById('welcomeScreen').classList.add('hide');
      document.getElementById('bodyEl').classList.remove('overflow-hidden');

        const d = document.createElement('div');
        d.className = "aspect-[4/5] bg-stone-100 rounded-2xl overflow-hidden relative cursor-pointer group shadow-sm hover:shadow-md transition-all duration-300";
        d.onclick = () => openModal(idx);
        d.innerHTML = `<img src="${img.url}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy">`;
        grid.appendChild(d);
      });
    };

    let modalScale = 1;
    const modalImgEl = document.getElementById('modalImg');

    const openModal = (i) => {
      modalIndex = i;
      modalScale = 1;
      modalImgEl.style.transform = `scale(${modalScale})`;
      modalImgEl.src = activeImages[i].url;
      document.getElementById('modalIndexIndicator').textContent = `${i + 1} / ${activeImages.length}`;
      document.getElementById('imageModal').classList.remove('hide');
      document.getElementById('imageModal').classList.add('flex');
      document.getElementById('bodyEl').classList.add('overflow-hidden');
    };

    window.closeImageModal = () => {
      document.getElementById('imageModal').classList.add('hide');
      document.getElementById('imageModal').classList.remove('flex');
      document.getElementById('bodyEl').classList.remove('overflow-hidden');
    };

    window.navigateModal = (dir) => {
      modalIndex = (modalIndex + dir + activeImages.length) % activeImages.length;
      openModal(modalIndex);
    };

    const setupModalZoom = () => {
      modalImgEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        modalScale += e.deltaY * -0.005;
        modalScale = Math.min(Math.max(1, modalScale), 7);
        modalImgEl.style.transform = `scale(${modalScale})`;
      });
    };

    let commentsData = [];
    const listenToComments = () => {
      const q = query(collection(db, "comments"), orderBy("timestamp", "desc"));
      onSnapshot(q, (snap) => {
        commentsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCommentsUI();
      }, (err) => {
        console.error(err);
      });
    };

    const renderCommentsUI = () => {
      const w = document.getElementById('commentsWrapper');
      w.innerHTML = '';
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
      
      if(!commentsData.length) {
        w.innerHTML = `<div class="text-center py-12 text-[#8e7a68] font-medium border border-dashed border-[#ebdcd0] rounded-2xl fade-in">${t.noComments}</div>`;
        return;
      }

      commentsData.forEach(c => {
        try {
          const div = document.createElement('div');
          div.className = "bg-white border border-[#ebdcd0] rounded-2xl p-6 space-y-4 shadow-sm fade-in hover:shadow-md transition-shadow duration-300";
          
          const targetCode = EXT_LANGS[currentLang] || currentLang.toLowerCase();
          
          let translatedStr = null;
          if (c.translatedText) {
            translatedStr = c.translatedText[targetCode];
            if (!translatedStr && currentLang === 'HE') {
              translatedStr = c.translatedText['iw'];
            }
          }
          
          const rawText = translatedStr ? translatedStr : c.originalText;
          const text = escapeHTML(rawText || '');
          const safeName = escapeHTML(c.name || '');
          const safeCountry = escapeHTML(c.country || '');
          const isTr = c.originalLang !== currentLang && !!translatedStr;

          let rHtml = '';
          Object.entries(c.reactions || {}).forEach(([emoji, users]) => {
            if(!users.length) return;
            const active = users.includes(userId);
            rHtml += `<button onclick="react('${c.id}','${emoji}',${active})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-300 ${active ? 'bg-[#b2533e]/10 text-[#b2533e] border border-[#b2533e]/30' : 'bg-stone-50 text-stone-600 border border-transparent hover:bg-stone-100'}">${emoji} ${users.length}</button>`;
          });

          div.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-[#2c2520]">${safeName}</h4>
                <p class="text-[10px] font-bold uppercase text-[#8e7a68] mt-1">📍 ${safeCountry}</p>
              </div>
            </div>
            <p class="text-base text-[#5c524a] font-medium leading-relaxed whitespace-pre-wrap">${text}</p>
            ${isTr ? `<p class="text-[11px] text-[#8e7a68] font-bold pt-2 border-t border-[#f1ede6]">✨ ${t.translatedFrom} ${c.originalLang}</p>` : ''}
            <div class="flex flex-wrap gap-2 pt-2 items-center">
              ${rHtml}
              <button onclick="togglePicker('${c.id}')" class="w-8 h-8 rounded-full bg-stone-50 flex items-center justify-center text-stone-400 font-bold hover:bg-stone-200 hover:text-[#b2533e] transition-colors duration-300 pb-1 text-lg shadow-sm border border-[#ebdcd0]">+</button>
            </div>
            <div id="picker-${c.id}" class="hidden flex-wrap gap-1.5 p-3 bg-[#f5efe6] rounded-2xl border border-[#ebdcd0] shadow-inner mt-3 fade-in">
              ${REACTIONS.map(e => `<button onclick="react('${c.id}','${e}',false); togglePicker('${c.id}')" class="w-9 h-9 flex items-center justify-center text-xl hover:bg-white hover:shadow-sm rounded-xl transition-all duration-200 hover:scale-110 border border-transparent hover:border-[#c7b198]">${e}</button>`).join('')}
            </div>
          `;
          w.appendChild(div);
        } catch (error) {}
      });
    };

    window.togglePicker = (id) => {
      const p = document.getElementById(`picker-${id}`);
      if(p.classList.contains('hidden')) {
        document.querySelectorAll('div[id^="picker-"]').forEach(el => el.classList.add('hidden'));
        p.classList.remove('hidden');
      } else {
        p.classList.add('hidden');
      }
    };

    window.react = async (id, em, act) => {
      const r = doc(db, "comments", id);
      await updateDoc(r, { [`reactions.${em}`]: act ? arrayRemove(userId) : arrayUnion(userId) });
    };

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmitComment');
      const loader = document.getElementById('loader');
      const name = document.getElementById('formName').value;
      const text = document.getElementById('formText').value;
      
      btn.disabled = true;
      loader.classList.remove('hide');
      
      try {
        await addDoc(collection(db, "comments"), {
          name: name,
          country: currentCountry,
          originalLang: currentLang,
          originalText: text,
          timestamp: serverTimestamp(),
          reactions: {}
        });
        
        document.getElementById('formText').value = '';
      } catch (err) {
      } finally {
        btn.disabled = false;
        loader.classList.add('hide');
      }
    });

    init();
  </script>
</body>
</html>
