    const COUNTRIES = {
      "Armenia": { native: "Հայաստան", lang: "AM" }, "Brazil": { native: "Brasil", lang: "PT" },
      "Chile": { native: "Chile", lang: "ES" }, "Dominican Republic": { native: "República Dominicana", lang: "ES" },
      "Israel": { native: "יִשְׂרָאֵל", lang: "HE" }, "Japan": { native: "日本", lang: "JA" },
      "USA": { native: "United States", lang: "EN" }, "Nigeria": { native: "Nigeria", lang: "FR" },
      "Portugal": { native: "Portugal", lang: "PT" }, "Scandinavia": { native: "Scandinavia", lang: "SV" },
      "Lithuania": { native: "Lietuva", lang: "LT" }, "Latvia": { native: "Latvija", lang: "LV" },
      "Kurdistan": { native: "Kurdistan", lang: "KUR" }
    };

    const TRANSLATIONS = {
      LT: { heroDesc: "Sveiki atvykę, mieli mūsų tarptautinės dvasinės šeimos broliai ir sesės! Mes be galo džiaugiamės, kad atvykote į kongresą Lietuvoje. Mums be galo džiugu parodyti jums Lietuvą.", btnExplore: "Nuotraukos", btnLeaveMessage: "Laiškas", galleryTitle: "Darbo užkulisiai", commentsTitle: "Laiškas", commentsDesc: "Palikite mums keletą šiltų žodžių.", labelName: "Vardas", labelMsg: "Žinutė", btnSubmitComment: "Siųsti", commentsSub: "Atsiliepimai", labelTranslateOn: "AI vertimas įjungtas", wsTitle: "Sveiki!", wsDesc: "Pasirinkite nustatymus", wsCountryLabel: "Šalis", wsLangLabel: "Kalba", wsSizeLabel: "Teksto dydis", wsSizeNormal: "Standartinis", wsSizeLarge: "Padidintas", btnContinue: "Tęsti", wsPrivacy: "Privatumo politika", wsTerms: "Naudojimo taisyklės", wsAcceptText: "Sutinku su", wsAnd: "ir", translatedFrom: "Versta iš", loading: "Kraunama...", noComments: "Nėra komentarų.", docBtnClose: "Supratau" },
      EN: { heroDesc: "Welcome, dear brothers and sisters of our international spiritual family! We are thrilled that you came to the congress in Lithuania.", btnExplore: "Photos", btnLeaveMessage: "Letter", galleryTitle: "Behind the Scenes", commentsTitle: "Letter", commentsDesc: "Leave us a few warm words.", labelName: "Name", labelMsg: "Message", btnSubmitComment: "Send", commentsSub: "Guestbook", labelTranslateOn: "AI Translation On", wsTitle: "Welcome!", wsDesc: "Choose preferences", wsCountryLabel: "Country", wsLangLabel: "Language", wsSizeLabel: "Text Size", wsSizeNormal: "Normal", wsSizeLarge: "Large", btnContinue: "Continue", wsPrivacy: "Privacy Policy", wsTerms: "Terms", wsAcceptText: "I agree with", wsAnd: "and", translatedFrom: "Translated from", loading: "Loading...", noComments: "No comments yet.", docBtnClose: "I understand" },
      RU: { heroDesc: "Добро пожаловать, дорогие братья и сестры нашей международной семьи! Мы бесконечно рады, что вы приехали на конгресс в Литву.", btnExplore: "Фото", btnLeaveMessage: "Письмо", galleryTitle: "Закулисье", commentsTitle: "Письмо", commentsDesc: "Оставьте нам пару теплых слов.", labelName: "Имя", labelMsg: "Сообщение", btnSubmitComment: "Отправить", commentsSub: "Отзывы", labelTranslateOn: "AI-перевод включен", wsTitle: "Добро пожаловать!", wsDesc: "Настройки", wsCountryLabel: "Страна", wsLangLabel: "Язык", wsSizeLabel: "Размер текста", wsSizeNormal: "Обычный", wsSizeLarge: "Крупный", btnContinue: "Продолжить", wsPrivacy: "Политика конфиденциальности", wsTerms: "Условия", wsAcceptText: "Согласен с", wsAnd: "и", translatedFrom: "Переведено с", loading: "Загрузка...", noComments: "Комментариев пока нет.", docBtnClose: "Понятно" }
    };

    const DOCS = {
      privacy: { LT: { title: "Privatumo politika", text: "Jūsų vardas ir žinutė bus saugomi saugioje Firebase duomenų bazėje." }, EN: { title: "Privacy Policy", text: "Your name and message are stored in a secure Firebase database." }, RU: { title: "Конфиденциальность", text: "Ваше имя и сообщение хранятся в защищенной базе данных Firebase." } },
      terms: { LT: { title: "Naudojimo taisyklės", text: "Medžiaga skirta tik asmeniniam peržiūrai." }, EN: { title: "Terms of Use", text: "Content is for personal viewing only." }, RU: { title: "Условия использования", text: "Материалы только для личного пользования." } }
    };

    const REACTIONS = ['❤️', '👍', '🥰', '🙏', '🕊️', '☀️', '🇱🇹', '🇱🇻', '🇺🇸', '🇳🇬', '🇦🇲', '🇧🇷', '🇨🇱', '🇩🇴', '🇮🇱', '🇯🇵', '🇵🇹', '🇸🇪', '🇳🇴', '🇩🇰'];
    let prefs = null, currentLang = 'LT', currentCountry = 'Lithuania', currentSize = 'normal', activeCategory = 'all', activeImages = [], modalIndex = 0;
    const userId = localStorage.getItem('vf2026_uid') || ('u_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('vf2026_uid', userId);

    const init = () => {
      populateCountries();
      const saved = localStorage.getItem('vf2026_prefs');
      if (saved) {
        prefs = JSON.parse(saved);
        document.getElementById('welcomeScreen').classList.add('hide');
        document.getElementById('bodyEl').classList.remove('overflow-hidden');
        applyPrefs();
      } else {
        document.getElementById('welcomeScreen').classList.remove('hide');
      }
      renderGallery();
      listenToComments();
    };

    const populateCountries = () => {
      const sel = document.getElementById('wsCountry');
      Object.keys(COUNTRIES).sort().forEach(c => {
        sel.add(new Option(`${c} (${COUNTRIES[c].native})`, c));
      });
    };

    document.getElementById('wsCountry').onchange = (e) => {
      const lang = COUNTRIES[e.target.value].lang;
      document.getElementById('wsLang').value = lang;
      updateWSLang(lang);
    };

    document.getElementById('wsLang').onchange = (e) => updateWSLang(e.target.value);
    document.getElementById('wsAccept').onchange = (e) => document.getElementById('btnContinue').disabled = !e.target.checked;

    const updateWSLang = (l) => {
      const t = TRANSLATIONS[l] || TRANSLATIONS['EN'];
      ['wsTitle', 'wsDesc', 'wsCountryLabel', 'wsLangLabel', 'wsSizeLabel', 'wsSizeNormal', 'wsSizeLarge', 'btnContinue', 'wsPrivacy', 'wsTerms', 'wsAcceptText', 'wsAnd'].forEach(id => {
        const el = document.getElementById(id); if(el) el.textContent = t[id];
      });
    };

    document.getElementById('btnContinue').onclick = () => {
      prefs = { country: document.getElementById('wsCountry').value, lang: document.getElementById('wsLang').value, size: document.getElementById('wsSize').value };
      localStorage.setItem('vf2026_prefs', JSON.stringify(prefs));
      document.getElementById('welcomeScreen').classList.add('hide');
      document.getElementById('bodyEl').classList.remove('overflow-hidden');
      applyPrefs();
    };

    window.openSettings = () => { document.getElementById('welcomeScreen').classList.remove('hide'); document.getElementById('bodyEl').classList.add('overflow-hidden'); };
    window.openDoc = (type) => {
      const l = document.getElementById('wsLang').value; const d = (DOCS[type][l] || DOCS[type]['EN']);
      document.getElementById('docTitle').textContent = d.title; document.getElementById('docContent').innerHTML = d.text;
      document.getElementById('docModal').classList.remove('hide');
    };
    window.closeDoc = () => document.getElementById('docModal').classList.add('hide');

    const applyPrefs = () => {
      currentLang = prefs.lang; currentCountry = prefs.country; currentSize = prefs.size;
      document.documentElement.classList.toggle('text-large', currentSize === 'large');
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
      document.getElementById('heroDesc').textContent = t.heroDesc;
      document.getElementById('btnExplore').textContent = t.btnExplore;
      document.getElementById('btnLeaveMessage').textContent = t.btnLeaveMessage;
      document.getElementById('galleryTitle').textContent = t.galleryTitle;
      document.getElementById('commentsTitle').textContent = t.commentsTitle;
      document.getElementById('commentsDesc').textContent = t.commentsDesc;
      document.getElementById('labelName').textContent = t.labelName;
      document.getElementById('labelMsg').textContent = t.labelMsg;
      document.getElementById('btnSubmitComment').querySelector('span').textContent = t.btnSubmitComment;
      document.getElementById('commentsSub').textContent = t.commentsSub;
      document.getElementById('labelTranslateOn').textContent = t.labelTranslateOn;
      document.body.style.direction = currentLang === 'HE' ? 'rtl' : 'ltr';
      renderCommentsUI();
    };

    window.switchCategory = (cat) => {
      activeCategory = cat;
      ['All', 'Posters', 'Clay', 'Cards'].forEach(c => {
        const b = document.getElementById('catBtn'+c); if(!b) return;
        b.className = (c.toLowerCase() === cat || (c==='Cards' && cat==='postcards')) ? "px-5 py-2.5 text-sm font-bold text-[#b2533e] border-b-2 border-[#b2533e] whitespace-nowrap" : "px-5 py-2.5 text-sm font-bold text-[#8e7a68] border-b-2 border-transparent whitespace-nowrap";
      });
      renderGallery();
    };

    const renderGallery = () => {
      const grid = document.getElementById('galleryGrid'); grid.innerHTML = '';
      activeImages = IMAGES.filter(i => activeCategory === 'all' || i.cat === activeCategory);
      activeImages.forEach((img, idx) => {
        const d = document.createElement('div');
        d.className = "aspect-[4/5] bg-stone-100 rounded-2xl overflow-hidden relative cursor-pointer group shadow-sm";
        d.onclick = () => openModal(idx);
        d.innerHTML = `<img src="${img.url}" class="w-full h-full object-cover transition-transform group-hover:scale-105" loading="lazy">`;
        grid.appendChild(d);
      });
    };

    const openModal = (i) => {
      modalIndex = i; document.getElementById('modalImg').src = activeImages[i].url;
      document.getElementById('modalIndexIndicator').textContent = `${i+1} / ${activeImages.length}`;
      document.getElementById('imageModal').classList.remove('hide'); document.getElementById('imageModal').classList.add('flex');
    };
    window.closeImageModal = () => { document.getElementById('imageModal').classList.add('hide'); document.getElementById('imageModal').classList.remove('flex'); };
    window.navigateModal = (dir) => { modalIndex = (modalIndex + dir + activeImages.length) % activeImages.length; openModal(modalIndex); };

    let commentsData = [];
    const listenToComments = () => {
      onSnapshot(query(collection(db, "comments"), orderBy("timestamp", "desc")), (snap) => {
        commentsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCommentsUI();
      });
    };

    const renderCommentsUI = () => {
      const w = document.getElementById('commentsWrapper'); w.innerHTML = '';
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
      if(!commentsData.length) { w.innerHTML = `<p class="text-center py-10 text-[#8e7a68]">${t.noComments}</p>`; return; }

      commentsData.forEach(c => {
        const div = document.createElement('div');
        div.className = "bg-white border border-[#ebdcd0] rounded-2xl p-6 space-y-4 shadow-sm fade-in";
        // Extension output field: 'translatedText' (Object)
        const text = (c.translatedText && c.translatedText[currentLang]) ? c.translatedText[currentLang] : c.originalText;
        const isTr = c.originalLang !== currentLang && c.translatedText?.[currentLang];

        let rHtml = '';
        Object.entries(c.reactions || {}).forEach(([emoji, users]) => {
          if(!users.length) return;
          const active = users.includes(userId);
          rHtml += `<button onclick="react('${c.id}','${emoji}',${active})" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all ${active?'bg-[#b2533e]/10 text-[#b2533e] border border-[#b2533e]/30':'bg-stone-50 text-stone-600 border border-transparent'}">${emoji} ${users.length}</button>`;
        });

        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div><h4 class="font-bold text-[#2c2520]">${c.name}</h4><p class="text-[10px] font-bold uppercase text-[#8e7a68]">📍 ${c.country}</p></div>
          </div>
          <p class="text-sm font-medium leading-relaxed whitespace-pre-wrap">${text}</p>
          ${isTr ? `<p class="text-[10px] text-[#8e7a68] font-bold">✨ ${t.translatedFrom} ${c.originalLang}</p>` : ''}
          <div class="flex flex-wrap gap-2 pt-2">${rHtml}<button onclick="togglePicker('${c.id}')" class="w-8 h-8 rounded-full bg-stone-50 flex items-center justify-center text-stone-400 font-bold hover:bg-stone-100 transition-colors">+</button></div>
          <div id="picker-${c.id}" class="hidden flex flex-wrap gap-2 p-3 bg-stone-50 rounded-xl mt-2 border border-stone-100 shadow-inner">
            ${REACTIONS.map(e => `<button onclick="react('${c.id}','${e}',false); togglePicker('${c.id}')" class="text-xl hover:scale-125 transition-transform p-1">${e}</button>`).join('')}
          </div>
        `;
        w.appendChild(div);
      });
    };

    window.togglePicker = (id) => document.getElementById(`picker-${id}`).classList.toggle('hidden');
    window.react = async (id, em, act) => { const r = doc(db, "comments", id); await updateDoc(r, { [`reactions.${em}`]: act ? arrayRemove(userId) : arrayUnion(userId) }); };

    document.getElementById('commentForm').onsubmit = async (e) => {
      e.preventDefault();
      const b = document.getElementById('btnSubmitComment'), l = document.getElementById('loader');
      b.disabled = true; l.classList.remove('hide');
      try {
        await addDoc(collection(db, "comments"), {
          name: document.getElementById('formName').value,
          country: currentCountry,
          originalLang: currentLang,
          originalText: document.getElementById('formText').value,
          timestamp: serverTimestamp(),
          reactions: {}
        });
        document.getElementById('formText').value = '';
      } catch (err) { console.error(err); }
      b.disabled = false; l.classList.add('hide');
    };

    init();
  </script>
