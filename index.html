        const data = await res.json();
        return data[0].map(x => x[0]).join('');
      } catch (e) { return text; }
    }

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitComment'), loader = document.getElementById('loader'), textEl = document.getElementById('btnSubmitText');
      const name = document.getElementById('formName').value, text = document.getElementById('formText').value;
      btn.disabled = true; loader.classList.remove('hide'); if(textEl) textEl.classList.add('opacity-0');
      try {
        const translatedText = {};
        await Promise.all(Object.values(EXT_LANGS).map(async code => { translatedText[code] = await translateText(text, code); }));
        await addDoc(collection(db, "comments"), { name, country: currentCountry, originalLang: currentLang, originalText: text, translatedText, timestamp: serverTimestamp(), reactions: {} });
        document.getElementById('formText').value = ''; showToast((TRANSLATIONS[currentLang] || TRANSLATIONS['EN']).toastSent);
      } catch (err) {} finally { btn.disabled = false; loader.classList.add('hide'); if(textEl) textEl.classList.remove('opacity-0'); }
    });

    const listenToComments = () => { onSnapshot(query(collection(db, "comments"), orderBy("timestamp", "desc"), limit(200)), (snap) => { commentsData = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderCommentsUI(); }); };
    const renderCommentsUI = () => {
      const w = document.getElementById('commentsWrapper'); w.innerHTML = '';
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['EN'];
      if(!commentsData.length) { w.innerHTML = `<div class="text-center py-16 text-[#8e7a68] font-bold border border-dashed border-[#ebdcd0] rounded-[2rem] glass-card flex flex-col items-center gap-4 fade-in w-full"><span class="break-words px-2">${t.noComments}</span></div>`; return; }
      commentsData.forEach(c => {
        const targetCode = EXT_LANGS[currentLang];
        const text = escapeHTML(c.translatedText?.[targetCode] || c.originalText);
        const isTr = c.originalLang !== currentLang && c.translatedText?.[targetCode];
        const div = document.createElement('div');
        div.className = "glass-card rounded-[2rem] p-5 md:p-6 shadow-sm border border-white w-full fade-in mb-4";
        div.innerHTML = `<div class="flex items-start gap-4 mb-4"><div class="w-10 h-10 rounded-full bg-[#f5efe6] border border-[#c7b198] flex items-center justify-center text-[#b2533e] font-bold text-lg">${c.name.charAt(0).toUpperCase()}</div><div class="min-w-0"><h4 class="font-bold text-[#2c2520] truncate">${escapeHTML(c.name)}</h4><p class="text-[10px] font-bold uppercase text-[#8e7a68] tracking-wider">📍 ${escapeHTML(c.country)}</p></div></div><p class="text-sm md:text-base text-[#5c524a] font-medium leading-relaxed whitespace-pre-wrap break-words mb-4">${text}</p>${isTr ? `<p class="text-[10px] text-[#8e7a68] font-bold uppercase tracking-widest text-center py-2 border-t border-[#f1ede6]">✨ ${t.translatedFrom} ${c.originalLang}</p>` : ''}`;
        w.appendChild(div);
      });
    };

    const renderGallery = () => {
      const grid = document.getElementById('galleryGrid'); grid.innerHTML = ''; activeImages = IMAGES.filter(i => activeCategory === 'all' || i.cat === activeCategory);
      activeImages.forEach((img, idx) => {
        const d = document.createElement('div'); d.className = "aspect-[4/5] bg-stone-100 rounded-2xl overflow-hidden relative cursor-pointer group shadow-sm hover:shadow-2xl transition-all duration-500 hover:-translate-y-1 w-full"; d.onclick = () => openModal(idx);
        d.innerHTML = `<img src="${img.url}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy"><div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center"><svg class="w-8 h-8 text-white opacity-70" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6"></path></svg></div>`; grid.appendChild(d);
      });
    };

    const openModal = (i) => { modalIndex = i; document.getElementById('modalImg').src = activeImages[i].url; document.getElementById('modalIndexIndicator').textContent = `${i + 1} / ${activeImages.length}`; document.getElementById('imageModal').classList.remove('hide'); document.getElementById('imageModal').classList.add('flex'); };
    window.closeImageModal = () => { document.getElementById('imageModal').classList.add('hide'); document.getElementById('imageModal').classList.remove('flex'); };
    window.navigateModal = (dir) => { modalIndex = (modalIndex + dir + activeImages.length) % activeImages.length; openModal(modalIndex); };
    window.switchCategory = (cat) => { activeCategory = cat; renderGallery(); };
    window.openSettings = () => { document.getElementById('welcomeScreen').classList.remove('hide'); };
    const checkDeadline = () => { const passed = new Date() > new Date('2026-08-13T00:00:00+03:00'); document.getElementById('deadlineText').textContent = passed ? (TRANSLATIONS[currentLang] || TRANSLATIONS['EN']).formClosed : (TRANSLATIONS[currentLang] || TRANSLATIONS['EN']).deadlineMsg; if(passed) { document.getElementById('formName').disabled = document.getElementById('formText').disabled = document.getElementById('btnSubmitComment').disabled = true; } };

    document.getElementById('wsCountry').addEventListener('change', (e) => { const lang = COUNTRIES[e.target.value].lang; document.getElementById('wsLang').value = lang; });
    document.getElementById('wsAccept').addEventListener('change', (e) => document.getElementById('btnContinue').disabled = !e.target.checked);
    document.getElementById('btnContinue').addEventListener('click', () => { prefs = { country: document.getElementById('wsCountry').value, lang: document.getElementById('wsLang').value, size: document.getElementById('wsSize').value }; localStorage.setItem('vf2026_prefs', JSON.stringify(prefs)); document.getElementById('welcomeScreen').classList.add('hide'); applyPrefs(); });
    
    init();
  </script>
</body>
</html>
